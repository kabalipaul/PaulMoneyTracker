name: Build PaulMoneyTracker APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack project
        run: unzip -q -o PaulMoneyTracker.zip

      - name: Build APK
        working-directory: PaulMoneyTracker
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../PaulMoneyTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaulMoneyTracker-apk
          path: PaulMoneyTracker.apk

      - name: Publish APK for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PaulMoneyTracker build ${{ github.run_number }}
          files: PaulMoneyTracker.apk
